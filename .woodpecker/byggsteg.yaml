variables:
  - &byggsteg_image "docker.io/jjba23/byggsteg-woodpecker:v0.3.0"
  - &jointhefreeworld_byggsteg_url "https://byggsteg.jointhefreeworld.org"
  - &main_branch "trunk"

clone:
  - name: "⬇️ Clone Git repository"
    image: woodpeckerci/plugin-git
    settings:
      depth: 1

steps:
  get-byggsteg-token:
    name: "🔒 Get token @ Byggsteg"
    image: *byggsteg_image
    when:
      - event: [push]
        branch: [*main_branch]
    settings:
      BYGGSTEG_STEP: get-token
      BYGGSTEG_EMAIL:
        from_secret: BYGGSTEG_EMAIL
      BYGGSTEG_PASSWORD:
        from_secret: BYGGSTEG_PASSWORD
      BYGGSTEG_URL: *jointhefreeworld_byggsteg_url

  submit-byggsteg-job:
    name: "💼 Submit job @ Byggsteg"
    image: *byggsteg_image
    when:
      - event: [push]
        branch: [*main_branch]
    settings:
      BYGGSTEG_STEP: submit-job
      BYGGSTEG_URL: *jointhefreeworld_byggsteg_url
      # Two tasks in one job: the suites, and then the installation every
      # recipe depends on.  `maak package-smoke' runs scripts/install-tree --
      # the script the Arch, Debian and openSUSE recipes and the container image
      # all run -- and drives the staged launcher in both directions, so a
      # layout that would only fail inside a build chroot fails here instead.
      BYGGSTEG_JOB_CODE: |
        (lambda()
          `((task . ("maak-test" "maak-package-smoke"))
            (project . "%%CI_REPO_NAME%%")
            (branch-name . "%%CI_COMMIT_BRANCH%%")
            (clone-url . "%%CI_REPO_CLONE_URL%%")
            (env . ((HOME . "/tmp")))))

  poll-byggsteg-job:
    name: "🔄 Poll job status @ Byggsteg"
    image: *byggsteg_image
    when:
      - event: [push]
        branch: [*main_branch]
    settings:
      BYGGSTEG_STEP: poll-job
      BYGGSTEG_URL: *jointhefreeworld_byggsteg_url
