openapi: 3.0.3
info:
  title: Directional Collision
  version: 1.0.0
paths:
  /sign-in:
    post:
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignIn'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
components:
  schemas:
    SignIn:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
