openapi: 3.0.3
info:
  title: Params
  version: 1.0.0
paths:
  /items:
    get:
      operationId: listItems
      parameters:
        - name: tags
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items: {type: string}
        - name: filter
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              status: {type: string}
        - name: session
          in: cookie
          required: false
          schema: {type: string}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
